<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crescendo | Charts</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tw-config.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="charts" class="font-sans bg-bg text-text">

  <section class="max-w-shell mx-auto px-6 pt-14 pb-2">
    <div class="text-[13px] tracking-[0.28em] uppercase text-cyan mb-3">This week</div>
    <h1 class="m-0 text-[clamp(34px,4.5vw,52px)] font-bold tracking-[-0.01em]">Charts</h1>
  </section>

  <section class="max-w-shell mx-auto px-6 pt-8 pb-2 flex flex-col gap-[18px]">
    <a href="chart.html" class="relative flex flex-col justify-center gap-2 min-h-[150px] px-10 py-8 rounded-panel overflow-hidden border border-hair bg-chart-1 text-text transition-all duration-[350ms] ease hover:-translate-y-1 hover:border-hair-cyan">
      <div class="absolute inset-0 bg-[repeating-linear-gradient(115deg,rgba(255,255,255,0.03)_0_14px,rgba(0,0,0,0)_14px_28px)]"></div>
      <div class="absolute right-[-20px] top-1/2 -translate-y-1/2 text-[150px] font-bold text-white/5 leading-none pointer-events-none">100</div>
      <span class="relative text-[11px] tracking-[0.24em] uppercase text-[rgba(232,237,242,0.7)]">Chart</span>
      <span class="relative text-[32px] font-bold uppercase tracking-[0.02em]">Hot 100</span>
      <span class="relative inline-flex items-center gap-2 text-xs tracking-[0.18em] uppercase text-cyan">View chart <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg></span>
    </a>
    <a href="chart.html" class="relative flex flex-col justify-center gap-2 min-h-[150px] px-10 py-8 rounded-panel overflow-hidden border border-hair bg-chart-2 text-text transition-all duration-[350ms] ease hover:-translate-y-1 hover:border-hair-cyan">
      <div class="absolute inset-0 bg-[repeating-linear-gradient(115deg,rgba(255,255,255,0.03)_0_14px,rgba(0,0,0,0)_14px_28px)]"></div>
      <div class="absolute right-[-20px] top-1/2 -translate-y-1/2 text-[150px] font-bold text-white/5 leading-none pointer-events-none">100</div>
      <span class="relative text-[11px] tracking-[0.24em] uppercase text-[rgba(232,237,242,0.7)]">Chart</span>
      <span class="relative text-[32px] font-bold uppercase tracking-[0.02em]">Top 100 Artists</span>
      <span class="relative inline-flex items-center gap-2 text-xs tracking-[0.18em] uppercase text-cyan">View chart <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg></span>
    </a>
    <a href="chart.html" class="relative flex flex-col justify-center gap-2 min-h-[150px] px-10 py-8 rounded-panel overflow-hidden border border-hair bg-chart-3 text-text transition-all duration-[350ms] ease hover:-translate-y-1 hover:border-hair-cyan">
      <div class="absolute inset-0 bg-[repeating-linear-gradient(115deg,rgba(255,255,255,0.03)_0_14px,rgba(0,0,0,0)_14px_28px)]"></div>
      <div class="absolute right-[-20px] top-1/2 -translate-y-1/2 text-[150px] font-bold text-white/5 leading-none pointer-events-none">100</div>
      <span class="relative text-[11px] tracking-[0.24em] uppercase text-[rgba(232,237,242,0.7)]">Chart</span>
      <span class="relative text-[32px] font-bold uppercase tracking-[0.02em]">Top 100 Playlists</span>
      <span class="relative inline-flex items-center gap-2 text-xs tracking-[0.18em] uppercase text-cyan">View chart <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg></span>
    </a>
  </section>

  <section class="max-w-shell mx-auto px-6 pt-16 pb-[72px]">
    <h2 class="m-0 mb-7 text-center text-[15px] tracking-[0.24em] uppercase">Genre</h2>
    <div class="grid grid-cols-[repeat(auto-fit,minmax(240px,1fr))] gap-3.5">
      <a href="chart.html" class="relative flex items-center justify-center h-[170px] rounded-card overflow-hidden border border-hair bg-genre-1 text-text transition-all duration-[350ms] ease hover:scale-[1.03] hover:border-hair-magenta">
        <div class="absolute inset-0 bg-stripe"></div>
        <span class="absolute bottom-2.5 right-3.5 font-mono text-[10px] text-[rgba(232,237,242,0.35)]">genre image</span>
        <span class="relative text-[22px] font-bold uppercase tracking-[0.06em] bg-[rgba(7,9,12,0.65)] px-[18px] py-2 rounded-chip backdrop-blur-[3px]">Rock</span>
      </a>
      <a href="chart.html" class="relative flex items-center justify-center h-[170px] rounded-card overflow-hidden border border-hair bg-genre-2 text-text transition-all duration-[350ms] ease hover:scale-[1.03] hover:border-hair-magenta">

        <span class="relative text-[22px] font-bold uppercase tracking-[0.06em] bg-[rgba(7,9,12,0.65)] px-[18px] py-2 rounded-chip backdrop-blur-[3px]">Hip-hop</span>
      </a>
      <a href="chart.html" class="relative flex items-center justify-center h-[170px] rounded-card overflow-hidden border border-hair bg-genre-3 text-text transition-all duration-[350ms] ease hover:scale-[1.03] hover:border-hair-magenta">
        <div class="absolute inset-0 bg-stripe"></div>
        <span class="absolute bottom-2.5 right-3.5 font-mono text-[10px] text-[rgba(232,237,242,0.35)]">genre image</span>
        <span class="relative text-[22px] font-bold uppercase tracking-[0.06em] bg-[rgba(7,9,12,0.65)] px-[18px] py-2 rounded-chip backdrop-blur-[3px]">R&amp;B</span>
      </a>
      <a href="chart.html" class="relative flex items-center justify-center h-[170px] rounded-card overflow-hidden border border-hair bg-genre-4 text-text transition-all duration-[350ms] ease hover:scale-[1.03] hover:border-hair-magenta">
        <div class="absolute inset-0 bg-stripe"></div>
        <span class="absolute bottom-2.5 right-3.5 font-mono text-[10px] text-[rgba(232,237,242,0.35)]">genre image</span>
        <span class="relative text-[22px] font-bold uppercase tracking-[0.06em] bg-[rgba(7,9,12,0.65)] px-[18px] py-2 rounded-chip backdrop-blur-[3px]">Alte</span>
      </a>
      <a href="chart.html" class="relative flex items-center justify-center h-[170px] rounded-card overflow-hidden border border-hair bg-genre-5 text-text transition-all duration-[350ms] ease hover:scale-[1.03] hover:border-hair-magenta">
        <div class="absolute inset-0 bg-stripe"></div>
        <span class="absolute bottom-2.5 right-3.5 font-mono text-[10px] text-[rgba(232,237,242,0.35)]">genre image</span>
        <span class="relative text-[22px] font-bold uppercase tracking-[0.06em] bg-[rgba(7,9,12,0.65)] px-[18px] py-2 rounded-chip backdrop-blur-[3px]">Emerging</span>
      </a>
      <a href="chart.html" class="relative flex items-center justify-center h-[170px] rounded-card overflow-hidden border border-hair bg-genre-6 text-text transition-all duration-[350ms] ease hover:scale-[1.03] hover:border-hair-magenta">
        <div class="absolute inset-0 bg-stripe"></div>
        <span class="absolute bottom-2.5 right-3.5 font-mono text-[10px] text-[rgba(232,237,242,0.35)]">genre image</span>
        <span class="relative text-[22px] font-bold uppercase tracking-[0.06em] bg-[rgba(7,9,12,0.65)] px-[18px] py-2 rounded-chip backdrop-blur-[3px]">Hip-life</span>
      </a>
    </div>
  </section>

  <script src="main.js"></script>
</body>
</html>
